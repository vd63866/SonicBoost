
context.modules = [
{
    name = libpipewire-module-filter-chain
    flags = [ ifexists nofail ]

    args = {
        node.description = "SonicBoost Equalizer"
        media.name = "SonicBoost Equalizer"

        filter.graph = {
            nodes = [
                
            {
                type = builtin
                name = preamp
                label = linear
                control = {
                    "Mult" = 1.00000000
                    "Add" = 0.0
                }
            }
             
                {
                    type = builtin
                    name = band31
                    label = bq_peaking
                    control = {
                        "Freq" = 31.25
                        "Q" = 1.414
                        "Gain" = 0.0
                    }
                }
                 
                {
                    type = builtin
                    name = band62
                    label = bq_peaking
                    control = {
                        "Freq" = 62.5
                        "Q" = 1.414
                        "Gain" = 0.0
                    }
                }
                 
                {
                    type = builtin
                    name = band125
                    label = bq_peaking
                    control = {
                        "Freq" = 125.0
                        "Q" = 1.414
                        "Gain" = 0.0
                    }
                }
                 
                {
                    type = builtin
                    name = band250
                    label = bq_peaking
                    control = {
                        "Freq" = 250.0
                        "Q" = 1.414
                        "Gain" = 0.0
                    }
                }
                 
                {
                    type = builtin
                    name = band500
                    label = bq_peaking
                    control = {
                        "Freq" = 500.0
                        "Q" = 1.414
                        "Gain" = 0.0
                    }
                }
                 
                {
                    type = builtin
                    name = band1k
                    label = bq_peaking
                    control = {
                        "Freq" = 1000.0
                        "Q" = 1.414
                        "Gain" = 0.0
                    }
                }
                 
                {
                    type = builtin
                    name = band2k
                    label = bq_peaking
                    control = {
                        "Freq" = 2000.0
                        "Q" = 1.414
                        "Gain" = 0.0
                    }
                }
                 
                {
                    type = builtin
                    name = band4k
                    label = bq_peaking
                    control = {
                        "Freq" = 4000.0
                        "Q" = 1.414
                        "Gain" = 0.0
                    }
                }
                 
                {
                    type = builtin
                    name = band8k
                    label = bq_peaking
                    control = {
                        "Freq" = 8000.0
                        "Q" = 1.414
                        "Gain" = 0.0
                    }
                }
                 
                {
                    type = builtin
                    name = band16k
                    label = bq_peaking
                    control = {
                        "Freq" = 16000.0
                        "Q" = 1.414
                        "Gain" = 0.0
                    }
                }
                
            ]

            links = [
                { output = "preamp:Out" input = "band31:In" } { output = "band31:Out" input = "band62:In" } { output = "band62:Out" input = "band125:In" } { output = "band125:Out" input = "band250:In" } { output = "band250:Out" input = "band500:In" } { output = "band500:Out" input = "band1k:In" } { output = "band1k:Out" input = "band2k:In" } { output = "band2k:Out" input = "band4k:In" } { output = "band4k:Out" input = "band8k:In" } { output = "band8k:Out" input = "band16k:In" }
            ]
        }

        audio.channels = 2
        audio.position = [ FL FR ]

        capture.props = {
            node.name = "effect_input.sonicboost"
            media.class = Audio/Sink
        }

        playback.props = {
            node.name = "effect_output.sonicboost"
            node.passive = true
        }
    }
}
]
